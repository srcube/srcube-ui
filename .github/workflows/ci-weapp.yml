name: Weapp CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - feat/arch
    paths:
      - 'apps/sample-weapp/**'
      - '.github/workflows/ci-weapp.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      WEAPP_APPID: ${{ vars.WEAPP_APPID || vars['WEAPP-APPID'] || secrets.WEAPP_APPID || secrets['WEAPP-APPID'] }}
      WEAPP_UPLOAD_KEY: ${{ secrets.WEAPP_UPLOAD_KEY || secrets['WEAPP-UPLOAD-KEY'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload weapp dev build
        run: pnpm -C apps/sample-weapp run upload
